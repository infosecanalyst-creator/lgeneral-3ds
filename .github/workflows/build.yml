name: build-3ds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL 1.2 for 3DS
        run: |
          dkp-pacman -Sy --noconfirm --needed 3ds-sdl 3ds-sdl_mixer
          dkp-pacman -Qi 3ds-sdl_mixer | grep -i depends || true
          ls $DEVKITPRO/portlibs/3ds/lib | grep -E 'mikmod|mad|vorbis|ogg|mixer|modplug|flac' || true

      - name: Build lgeneral.3dsx
        run: make -j"$(nproc)"

      - name: Desktop syntax sanity (3DS paths only compile on device toolchain)
        run: ls -la lgeneral.3dsx build/lgeneral.elf

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota must never fail the build (delivery is the builds branch)
        with:
          name: lgeneral-3ds-${{ github.sha }}
          path: |
            lgeneral.3dsx
            build/lgeneral.elf
            build/lgeneral.map
