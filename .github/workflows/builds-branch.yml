name: build-3dsx
# Builds the 3DS binary and publishes it to the `builds` branch (3dsx + logs + SOURCE_COMMIT)
# so it can be fetched without a local PC build.
on:
  push:
    branches: ["**", "!builds"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git >/dev/null
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: SDL 1.2 for 3DS
        run: dkp-pacman -Sy --noconfirm --needed 3ds-sdl 3ds-sdl_mixer 2>&1 | tee libs.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Build
        run: make -j$(nproc) 2>&1 | tee build.log; test -f lgeneral.3dsx
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp lgeneral.3dsx libs.log build.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
      - name: Publish to builds branch
        if: success()   # never replace the last good build with a failed one (e.g. when pkg.devkitpro.org refuses the runner)
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
